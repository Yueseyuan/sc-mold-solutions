<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yueseyuan Cruel — SC Mold Solutions</title>
<meta name="description" content="Digital business card for Yueseyuan Cruel, Founder of SC Mold Solutions. Save to contacts or visit the website.">
<link rel="icon" type="image/png" href="../assets/logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1c2f20;
    --green-deep: #0f1c12;
    --gold: #b4863f;
    --gold-light: #e2c07f;
    --paper: #f4ecd8;
    --ink: #1c2620;
    --ink-soft: #6c7a67;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: radial-gradient(900px 600px at 50% -10%, #24392a 0%, var(--green-deep) 70%);
    color: var(--paper);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px calc(28px + env(safe-area-inset-bottom));
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .logo {
    width: 84px; height: 84px;
    border-radius: 18px;
    margin: 0 auto 18px;
    box-shadow: 0 14px 34px -14px rgba(0,0,0,0.55);
  }

  h1 {
    font-family: 'Manrope', sans-serif;
    font-size: 25px;
    font-weight: 800;
    color: var(--gold-light);
    letter-spacing: -0.3px;
  }
  .role { font-size: 15.5px; font-weight: 600; color: var(--paper); margin-top: 4px; }
  .company { font-size: 14.5px; color: #a9b8a3; margin-top: 2px; }

  .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 20px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15.5px;
    text-decoration: none;
    border: 1.5px solid transparent;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-gold { background: var(--gold); color: #1c1408; }
  .btn-gold:hover { background: var(--gold-light); }
  .btn-line { background: rgba(255,255,255,0.05); border-color: rgba(226,192,127,0.4); color: var(--gold-light); }
  .btn-line:hover { border-color: var(--gold-light); background: rgba(255,255,255,0.08); }

  .quick {
    display: flex; gap: 12px; margin-top: 16px;
  }
  .quick a {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    color: #d9e2d4;
    text-decoration: none;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .quick svg { color: var(--gold-light); }

  .divider { height: 1px; background: rgba(255,255,255,0.1); margin: 28px 0 20px; }

  .badges { display: flex; justify-content: center; gap: 22px; }
  .badge { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 78px; }
  .badge .circ {
    width: 46px; height: 46px; border-radius: 50%;
    border: 1.5px solid rgba(226,192,127,0.55);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-light);
  }
  .badge .lbl { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; color: #a9b8a3; text-align: center; line-height: 1.3; }

  .tagline {
    margin-top: 26px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #8a9a85;
  }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px);
    background: var(--gold-light); color: #1c1408; font-weight: 700; font-size: 13.5px;
    padding: 10px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 5;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

</html>
